name: Build

# NOTE: this is one of only 2 files added to the repo for CI.
# All code changes (including PR #23) are applied on-the-fly
# inside this workflow, so src/Makefile/vcxproj stay pristine.
# Second file: .github/workflows/merge-pr.yml (persistent PR merge).

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------- Windows (MSVC, x64 Release) ----------------
  build-windows-x64:
    name: Windows x64
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      # run-vcpkg bootstraps vcpkg here; MSBuild locates vcpkg.props/targets via this.
      # Without it the vcpkg import is silently skipped -> no includes -> C1083.
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - name: Checkout (full history, needed for on-the-fly PR merge)
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Apply PR #23 on-the-fly (CanSell steam_web_api_key fix)
        shell: bash
        run: |
          set -e
          # Fork-safe: PR #23 lives on soyware/OpenMarketClient upstream.
          # `origin` has no pull/23 ref on forks, so fall back to explicit upstream URL.
          git fetch origin pull/23/head:pr-23 2>/dev/null || git fetch https://github.com/soyware/OpenMarketClient.git pull/23/head:pr-23
          if git merge-base --is-ancestor pr-23 HEAD; then
            echo "PR #23 already in HEAD, skipping merge"
          else
            git -c user.name="github-actions" -c user.email="github-actions@github.com" merge --no-ff pr-23 -m "CI: merge PR #23 on-the-fly"
          fi
          git log --oneline -3
          git diff HEAD~1 --stat || true

      - name: Generate vcpkg.json + MSBuild wiring on-the-fly (not committed)
        shell: bash
        run: |
          cat > vcpkg.json <<'EOF'
          {
            "$schema": "https://raw.githubusercontent.com/microsoft/vcpkg-tool/main/docs/vcpkg.schema.json",
            "name": "openmarketclient",
            "version-string": "0.4.4",
            "builtin-baseline": "1577f17ee57f42a0ef6d75bbb82cb37d0b76d7e8",
            "description": "Unofficial cross-platform console client for market.csgo.com / market.dota2.net / tf2.tm / rust.tm / gifts.tm",
            "dependencies": [
              "curl",
              "rapidjson",
              "wolfssl",
              "zlib"
            ]
          }
          EOF
          cat vcpkg.json
          # MSBuild manifest lookup expects vcpkg.json next to the .vcxproj,
          # so drop an identical copy into vsproject/ as well.
          cp vcpkg.json vsproject/vcpkg.json
          # Directory.Build.targets is auto-imported AFTER every project, so it
          # can override item metadata (plain /p: cannot - those are properties).
          # vcpkg MSBuild integration stays disabled; wire the installed tree here.
          # No shell quoting involved at all (this dodges pwsh/MSBuild ;-parsing).
          cat > Directory.Build.targets <<'EOF'
          <Project>
            <!-- Generated on-the-fly by CI (.github/workflows/build.yml). -->
            <!-- NOTE: %(...) suffixes are load-bearing: they carry the Windows SDK
                 paths injected by the toolset props. Never drop them. -->
            <ItemDefinitionGroup Condition="'$(Configuration)|$(Platform)' == 'Release|x64'">
              <ClCompile>
                <AdditionalIncludeDirectories>$(GITHUB_WORKSPACE)\vsproject\vcpkg_installed\x64-windows-static\include;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
                <!-- vcpkg static triplet is /MT; toolset default is /MD -> LNK2038 -->
                <RuntimeLibrary>MultiThreaded</RuntimeLibrary>
              </ClCompile>
              <Link>
                <AdditionalLibraryDirectories>$(GITHUB_WORKSPACE)\vsproject\vcpkg_installed\x64-windows-static\lib;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>
                <!-- System libs over-listed on purpose: unreferenced ones are
                     ignored, a missing one would be LNK2019. Project's own
                     Ws2_32/wolfssl/libcurl come via %() below, no dupes. -->
                <AdditionalDependencies>Wldap32.lib;Crypt32.lib;Secur32.lib;Advapi32.lib;Normaliz.lib;zlib.lib;%(AdditionalDependencies)</AdditionalDependencies>
              </Link>
            </ItemDefinitionGroup>
          </Project>
          EOF
          cat Directory.Build.targets

      - name: Setup vcpkg (restore deps from generated vcpkg.json)
        uses: lukka/run-vcpkg@v11.6
        with:
          vcpkgJsonGlob: 'vcpkg.json'
          # Pinned vcpkg commit, must match builtin-baseline in generated vcpkg.json.
          vcpkgGitCommitId: '1577f17ee57f42a0ef6d75bbb82cb37d0b76d7e8'

      - name: Generate overlay triplet (wolfSSL scrypt on)
        # wolfSSL 5.9.2 CMake has NO scrypt option (their own "# TODO: - SCRYPT"
        # in CMakeLists), so VCPKG_CMAKE_CONFIGURE_OPTIONS can't help. Instead
        # pass -DHAVE_SCRYPT as a plain compiler flag: the triplet's VCPKG_C_FLAGS
        # reach every port's C compile, enabling both the decl (pwdbased.h) and
        # the impl (pwdbased.c) of wc_scrypt. Consumer side gets the same define
        # from the Precompiled.h patch below.
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path vsproject/vcpkg-triplets | Out-Null
          @(
            'set(VCPKG_TARGET_ARCHITECTURE x64)',
            'set(VCPKG_CRT_LINKAGE static)',
            'set(VCPKG_LIBRARY_LINKAGE static)',
            '# CI: code calls wc_scrypt, gated by HAVE_SCRYPT in 5.9.2.',
            'set(VCPKG_C_FLAGS "-DHAVE_SCRYPT")'
          ) | Set-Content vsproject/vcpkg-triplets/x64-windows-static.cmake
          Get-Content vsproject/vcpkg-triplets/x64-windows-static.cmake

      - name: vcpkg install (explicit, no silent-skips)
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --overlay-triplets=vsproject/vcpkg-triplets --x-manifest-root=vsproject --x-install-root=vsproject\vcpkg_installed --triplet x64-windows-static

      - name: List installed headers (ground truth for patch logic)
        shell: pwsh
        run: |
          Get-ChildItem vsproject\vcpkg_installed\x64-windows-static\include\wolfssl | Select-Object Name
          Test-Path vsproject\vcpkg_installed\x64-windows-static\include\wolfssl\options.h
          Test-Path vsproject\vcpkg_installed\x64-windows-static\include\curl\curl.h
          Test-Path vsproject\vcpkg_installed\x64-windows-static\include\rapidjson\document.h
          # Proof the lib really contains the symbol (empty = C_FLAGS missed):
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -products * -requires Microsoft.Component.MSBuild -property installationPath -latest
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & $dumpbin.FullName /symbols 'vsproject\vcpkg_installed\x64-windows-static\lib\wolfssl.lib' | Select-String -Pattern 'wc_scrypt' | Select-Object -First 10

      - name: Patch src/Precompiled.h on-the-fly (use vcpkg options.h directly)
        shell: python
        run: |
          import pathlib
          p = pathlib.Path("src/Precompiled.h")
          s = p.read_text(encoding="utf-8")
          if "patched on-the-fly by CI" in s:
              print("Precompiled.h already patched, skipping")
          else:
              # NOTE: unconditional on purpose. In CI the vcpkg tree always
              # provides wolfssl/options.h (proven by the listing step above),
              # while local VS builds keep the pristine IDE/WIN/user_settings.h
              # path untouched.
              # HAVE_SCRYPT: lib is built with -DHAVE_SCRYPT via triplet
              # VCPKG_C_FLAGS (5.9.2 CMake has no scrypt option); mirror the
              # same define here so decl (pwdbased.h) matches the lib symbol.
              old = "#define WOLFSSL_LIB\n#include <IDE/WIN/user_settings.h>\n#undef WOLFSSL_LIB"
              new = ("// wolfSSL config (patched on-the-fly by CI):\n"
                     "// vcpkg/CMake builds provide wolfssl/options.h, use it.\n"
                     "#define HAVE_SCRYPT 1\n"
                     "#include <wolfssl/options.h>")
              assert old in s, "Precompiled.h pattern not found, update CI patch"
              p.write_text(s.replace(old, new), encoding="utf-8")
              print("Precompiled.h patched")

      - name: Diagnose vcpkg wiring (fast, pinpoints silent-skips)
        shell: pwsh
        run: |
          "VCPKG_ROOT=$env:VCPKG_ROOT"
          "VCPKG_INSTALLATION_ROOT=$env:VCPKG_INSTALLATION_ROOT"
          Test-Path vcpkg.json
          Test-Path vsproject/vcpkg.json
          Test-Path Directory.Build.targets
          Test-Path "$env:VCPKG_ROOT/vcpkg.exe"
          & "$env:VCPKG_ROOT/vcpkg.exe" version

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3.0.0

      - name: Build Release|x64
        # Wiring (includes/libs/RuntimeLibrary) comes from Directory.Build.targets,
        # NOT from /p: here: those are item metadata, global /p: can't touch them,
        # and pwsh mangles ;-separated /p: values on the way to native msbuild.
        run: msbuild OpenMarketClient.sln /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnabled=false /m /v:m

      - name: Smoke test (--help)
        run: .\build\x64\Release\OpenMarketClient.exe --help
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: OpenMarketClient-windows-x64
          path: build/x64/Release/OpenMarketClient.exe
          if-no-files-found: error

  # ---------------- Linux amd64 (native) ----------------
  build-linux-amd64:
    name: Linux amd64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history, needed for on-the-fly PR merge)
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Apply PR #23 on-the-fly (CanSell steam_web_api_key fix)
        run: |
          set -e
          # Fork-safe: PR #23 lives on soyware/OpenMarketClient upstream.
          # `origin` has no pull/23 ref on forks, so fall back to explicit upstream URL.
          git fetch origin pull/23/head:pr-23 2>/dev/null || git fetch https://github.com/soyware/OpenMarketClient.git pull/23/head:pr-23
          if git merge-base --is-ancestor pr-23 HEAD; then
            echo "PR #23 already in HEAD, skipping merge"
          else
            git -c user.name="github-actions" -c user.email="github-actions@github.com" merge --no-ff pr-23 -m "CI: merge PR #23 on-the-fly"
          fi
          git log --oneline -3

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libcurl4-openssl-dev libwolfssl-dev rapidjson-dev zlib1g-dev file

      - name: Build
        run: |
          make -j$(nproc) DIR_OUT=build/linux-amd64
          file build/linux-amd64/OpenMarketClient
          ldd build/linux-amd64/OpenMarketClient || true

      - name: Smoke test (--help)
        run: ./build/linux-amd64/OpenMarketClient --help || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: OpenMarketClient-linux-amd64
          path: build/linux-amd64/OpenMarketClient
          if-no-files-found: error

  # ---------------- Linux arm64 / v8 (native ARM runner) ----------------
  build-linux-arm64:
    name: Linux arm64 (v8)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout (full history, needed for on-the-fly PR merge)
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Apply PR #23 on-the-fly (CanSell steam_web_api_key fix)
        run: |
          set -e
          # Fork-safe: PR #23 lives on soyware/OpenMarketClient upstream.
          # `origin` has no pull/23 ref on forks, so fall back to explicit upstream URL.
          git fetch origin pull/23/head:pr-23 2>/dev/null || git fetch https://github.com/soyware/OpenMarketClient.git pull/23/head:pr-23
          if git merge-base --is-ancestor pr-23 HEAD; then
            echo "PR #23 already in HEAD, skipping merge"
          else
            git -c user.name="github-actions" -c user.email="github-actions@github.com" merge --no-ff pr-23 -m "CI: merge PR #23 on-the-fly"
          fi
          git log --oneline -3

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libcurl4-openssl-dev libwolfssl-dev rapidjson-dev zlib1g-dev file

      - name: Build
        run: |
          make -j$(nproc) DIR_OUT=build/linux-arm64
          file build/linux-arm64/OpenMarketClient
          ldd build/linux-arm64/OpenMarketClient || true

      - name: Smoke test (--help)
        run: ./build/linux-arm64/OpenMarketClient --help || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: OpenMarketClient-linux-arm64
          path: build/linux-arm64/OpenMarketClient
          if-no-files-found: error

  # ---------------- Linux armv7 (32-bit, emulated via QEMU) ----------------
  # GitHub has no native armv7 runners, so build inside arm32v7/ubuntu container.
  # PR #23 is merged on the host before entering the container (workspace is shared).
  build-linux-armv7:
    name: Linux armv7
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history, needed for on-the-fly PR merge)
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: Apply PR #23 on-the-fly (CanSell steam_web_api_key fix)
        run: |
          set -e
          # Fork-safe: PR #23 lives on soyware/OpenMarketClient upstream.
          # `origin` has no pull/23 ref on forks, so fall back to explicit upstream URL.
          git fetch origin pull/23/head:pr-23 2>/dev/null || git fetch https://github.com/soyware/OpenMarketClient.git pull/23/head:pr-23
          if git merge-base --is-ancestor pr-23 HEAD; then
            echo "PR #23 already in HEAD, skipping merge"
          else
            git -c user.name="github-actions" -c user.email="github-actions@github.com" merge --no-ff pr-23 -m "CI: merge PR #23 on-the-fly"
          fi
          git log --oneline -3

      - name: Setup docker credential helper (pass, pinned v0.9.9)
        # run-on-arch-action does `docker login ghcr.io` for image caching.
        # Stock runners have no credential helper -> token lands in plaintext
        # + warning. GPG+pass keeps it encrypted; ephemeral key, CI-only.
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y pass gnupg jq
          printf '%s\n' 'Key-Type: 1' 'Key-Length: 2048' 'Subkey-Type: 1' 'Subkey-Length: 2048' 'Name-Real: docker credential store' 'Name-Email: docker@localhost' 'Expire-Date: 0' '%no-protection' '%commit' > /tmp/gpg-batch
          gpg --batch --gen-key /tmp/gpg-batch
          FPR=$(gpg --list-keys --with-colons docker@localhost | awk -F: '$1=="fpr" {print $10; exit}')
          pass init "$FPR"
          HELPER_VER=v0.9.9
          HELPER_SHA256=ae80a143101672b53c65cd5aa05028897068d39e2649adff83a520ef3218355d
          curl -sSL -o /tmp/docker-credential-pass "https://github.com/docker/docker-credential-helpers/releases/download/${HELPER_VER}/docker-credential-pass-${HELPER_VER}.linux-amd64"
          echo "${HELPER_SHA256}  /tmp/docker-credential-pass" | sha256sum -c -
          sudo install -m 0755 /tmp/docker-credential-pass /usr/local/bin/docker-credential-pass
          mkdir -p ~/.docker
          [ -f ~/.docker/config.json ] || echo '{}' > ~/.docker/config.json
          jq '.credsStore = "pass"' ~/.docker/config.json > /tmp/docker-config.json
          mv /tmp/docker-config.json ~/.docker/config.json
          cat ~/.docker/config.json

      - name: Build in armv7 container (QEMU)
        uses: uraimo/run-on-arch-action@v3.2.0
        with:
          arch: armv7
          distro: ubuntu22.04
          # Login (image-layer caching) is on: the token is stored encrypted
          # via the pass credential helper (see setup step above), so no
          # "credentials stored unencrypted" warning.
          githubToken: ${{ github.token }}
          # Silences the "image platform (linux/arm/v7) does not match host" warning.
          dockerRunArgs: '--platform linux/arm/v7'
          install: |
            apt-get update -q -y
            apt-get install -q -y g++ make libcurl4-openssl-dev libwolfssl-dev rapidjson-dev zlib1g-dev file
          run: |
            set -e
            make -j$(nproc) DIR_OUT=build/linux-armv7
            file build/linux-armv7/OpenMarketClient
            ldd build/linux-armv7/OpenMarketClient || true
            ./build/linux-armv7/OpenMarketClient --help || true

      - name: Upload artifact
        uses: actions/upload-artifact@v6.0.0
        with:
          name: OpenMarketClient-linux-armv7
          path: build/linux-armv7/OpenMarketClient
          if-no-files-found: error

  # ---------------- Release (on tag v*) ----------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows-x64, build-linux-amd64, build-linux-arm64, build-linux-armv7]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7.0.0
        with:
          path: dist

      - name: Prepare release files
        run: |
          set -e
          ls -R dist
          mkdir -p release
          cp dist/OpenMarketClient-windows-x64/OpenMarketClient.exe release/OpenMarketClient-windows-x64.exe
          cp dist/OpenMarketClient-linux-amd64/OpenMarketClient release/OpenMarketClient-linux-amd64
          cp dist/OpenMarketClient-linux-arm64/OpenMarketClient release/OpenMarketClient-linux-arm64
          cp dist/OpenMarketClient-linux-armv7/OpenMarketClient release/OpenMarketClient-linux-armv7
          chmod +x release/OpenMarketClient-linux-*
          ls -lh release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: release/*
          generate_release_notes: true
